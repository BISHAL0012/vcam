name: Build VCamsX APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Binaries are stored as base64 twins (*.b64) because the push
      # API is text-only; decode them back here. Vcam DOES use native
      # code (ijkplayer .so files for video playback), so the .so
      # twins must be decoded or the build breaks at runtime packaging.
      # IMPORTANT: delete each .b64 after decoding — Android's
      # resource merger rejects any res/ file not ending .xml/.png,
      # and leftover .b64 files failed run #52 (mergeReleaseResources).
      - name: Decode icon PNGs
        run: |
          find app/src/main/res -name '*.png.b64' | while read f; do
            base64 -d "$f" > "${f%.b64}" && rm "$f"
          done
          if [ -f app/src/main/res/raw/vcamsx.mp4.b64 ]; then
            base64 -d app/src/main/res/raw/vcamsx.mp4.b64 > app/src/main/res/raw/vcamsx.mp4 && rm app/src/main/res/raw/vcamsx.mp4.b64
          fi
          if find app/src/main/res -name '*.b64' | grep -q .; then
            echo "ERROR: leftover .b64 files in res/:"; find app/src/main/res -name '*.b64'; exit 1
          fi

      - name: Decode native libs and gradle wrapper
        run: |
          find app/src/main/jniLibs -name '*.so.b64' | while read f; do
            base64 -d "$f" > "${f%.b64}" && rm "$f"
          done
          if [ -f gradle/wrapper/gradle-wrapper.jar.b64 ]; then
            base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar && rm gradle/wrapper/gradle-wrapper.jar.b64
          fi
          if find app/src/main/jniLibs gradle/wrapper -name '*.b64' | grep -q .; then
            echo "ERROR: leftover .b64 files:"; find app/src/main/jniLibs gradle/wrapper -name '*.b64'; exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-apk
          path: app/build/outputs/apk/release/*.apk
